<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./to.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="todo-container">
        <h1><i class="fa-solid fa-list-check todo-icon"></i> TO-DO List</h1>
        <form>
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="todo-input" type="text"  placeholder="Enter Your Task" required>
            <button id="todo-btn"><i class="fa-solid fa-plus"></i></button>
        </form>
    </div>
    <div class="list-container">
        <ul class="todo-list">

        </ul>
    </div>
    <script src="./to.js"></script>
</body>
</html>
